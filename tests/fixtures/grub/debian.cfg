### BEGIN /etc/grub.d/00_header ###
set default="0"
### END /etc/grub.d/00_header ###

menuentry 'Ubuntu 24.04 LTS' --class ubuntu --class gnu-linux --class gnu-linux-gnu $menuentry_id_option 'gnulinux-simple-6b1c2d3e' {
	linux	/boot/vmlinuz-6.8.0-31-generic root=UUID=6b1c2d3e ro
	initrd	/boot/initrd.img-6.8.0-31-generic
}

submenu 'Advanced options for Ubuntu 24.04 LTS' $menuentry_id_option 'gnulinux-advanced-6b1c2d3e' {
	menuentry 'Ubuntu 24.04 LTS, with Linux 6.8.0-31-generic' --class ubuntu --class gnu-linux --class gnu-linux-gnu $menuentry_id_option 'gnulinux-6.8.0-31-generic-6b1c2d3e' {
		linux	/boot/vmlinuz-6.8.0-31-generic root=UUID=6b1c2d3e ro
		initrd	/boot/initrd.img-6.8.0-31-generic
	}
	menuentry 'Ubuntu 24.04 LTS, with Linux 6.8.0-30-generic' --class ubuntu --class gnu-linux --class gnu-linux-gnu $menuentry_id_option 'gnulinux-6.8.0-30-generic-6b1c2d3e' {
		linux	/boot/vmlinuz-6.8.0-30-generic root=UUID=6b1c2d3e ro
		initrd	/boot/initrd.img-6.8.0-30-generic
	}
}
